<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zAcademy</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <!-- header  -->
    <header class="navbar">
        <div class="container nav-inner">
            <a href="" class="logo">
                <span class="logo-mark">zA</span>
                <span class="logo-text">zAcademy</span>
            </a>
            <nav>
                <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <ul class="nav-menu" id="navMenu">
                    <li><a href="#home">Home</a></li>
                    <li><a href="#course">Course</a></li>
                    <li><a href="#about">About</a></li>
                    <li><a href="#contact">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Hero section -->
    <section id="home" class="hero">
        <div class="container hero-inner">
            <div class="hero-text">
                <p class="eyebrow">Welcome to zAcademy</p>
                <h1>Learn The skills <br> forge your future</h1>
                <p class="lead">
                    Hands-on training programs taught by industry experts. From your first line of code to advanced mastery - we've got a path for you.
                </p>
                <a href="#course" class="btn btn-primary">Enroll Now</a>
            </div>
            <div class="hero-art" aria-hidden="true">
                <div class="acaphoto">
                    <img src="./hero.jpg" alt="">
                </div>
                <div class="card-float">
                    <strong>100+</strong> <span>Graduates this year</span>
                </div>
            </div>
        </div>
    </section>

    <script src="./script.js"></script>
</body>
</html>
